<!--
   Prowise Display 86 Zoll 16:9 Auflösung 3840x2160

   RG-Foyer: (Heute, Morgen, Übermorgen)
   Heute: https://intranet.tam.ch/krr/public/timetable/daily-class-schedule?dayShort=today
   Morgen: https://intranet.tam.ch/krr/public/timetable/daily-class-schedule?dayShort=tomorrow
   Übermorgen https://intranet.tam.ch/krr/public/timetable/daily-class-schedule?dayShort=dayAfterTomorrow
    -->
<!doctype html>
<html lang="en">
   <head>
      <!-- Required meta tags -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- kein meta-refresh: die iFrames werden im Hintergrund getauscht -->
      <style>
         body {
         background-color: #000;
         }
         #frame1, #frame2 {
         width: 985px;
         height: 1640px;
         position: relative;

         -webkit-transform: scale(1.3, 1.3);
         -o-transform: scale(1.3, 1.3);
         -ms-transform: scale(1.3, 1.3);
         transform: scale(1.3, 1.3);

         -moz-transform-origin: top left;
         -webkit-transform-origin: top left;
         -o-transform-origin: top left;
         -ms-transform-origin: top left;
         transform-origin: top left;
         }
         #frame3 {
           background-color: #FFF;
         width: 2560px;
         height: 4305px;
         position: relative;

         -webkit-transform: scale(0.501, 0.501);
         -o-transform: scale(0.501, 0.501);
         -ms-transform: scale(0.501, 0.501);
         transform: scale(0.501, 0.501);


         -moz-transform-origin: top left;
         -webkit-transform-origin: top left;
         -o-transform-origin: top left;
         -ms-transform-origin: top left;
         transform-origin: top left;
         }

         /* hide scrollbar but allow scrolling */
         body {
         -ms-overflow-style: none; /* for Internet Explorer, Edge */
         scrollbar-width: none; /* for Firefox */
         overflow: hidden;
         }
         body::-webkit-scrollbar {
         display: none; /* for Chrome, Safari, and Opera */
         }
      </style>
      <title>Foyer</title>
   </head>
   <body>
      <div>
         <div id="screenContent" style="visibility:hidden;">
            <iframe id="frame1" style="position: absolute; top:0; left: 0"      src="https://intranet.tam.ch/krl/public/timetable/daily-class-schedule?dayShort=today" frameborder="0" scrolling="no"></iframe>
            <iframe id="frame2" style="position: absolute; top:0; left: 1280px;"  src="https://intranet.tam.ch/krl/public/timetable/daily-class-schedule?dayShort=tomorrow" frameborder="0" scrolling="no"></iframe>
            <iframe id="frame3" style="position: absolute; top:0; left: 2560px;" src="https://www.lgr.ch/infoscreen" frameborder="0" scrolling="no"></iframe>
         </div>
      </div>
      <script src="frame-refresh.js"></script>
      <script>

        //prettier loading of content
        window.addEventListener("load", function () {
          document.getElementById('screenContent').style.visibility = 'visible';
        });

        // Panels im Hintergrund neu laden, ohne sichtbaren Reload
        FrameRefresh.start({
          frames: [
              { id: 'frame1', height: '1659px' },
              { id: 'frame2', height: '1659px' },
              { id: 'frame3' }
          ],
          interval: 600000
        });

      </script>
   </body>
</html>
